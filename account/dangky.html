<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng Ký Tài Khoản Mới | Pizza AI</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#f27f0d",
                "background-light": "#f8f7f5",
                "background-dark": "#181411",
            },
            fontFamily: {
                display: ["Be Vietnam Pro", "sans-serif"]
            },
            borderRadius: {
                DEFAULT: "0.5rem",
                lg: "1rem",
                xl: "1.5rem",
                full: "9999px"
            },
        },
    },
}
</script>

<style>
.material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
body {
    font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
}
</style>
</head>

<body class="bg-background-light dark:bg-background-dark text-white min-h-screen">

<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex grow flex-col">

<!-- ❌ NAVIGATION ĐÃ ĐƯỢC BỎ HOÀN TOÀN -->

<!-- Main Content Split Screen -->
<main class="flex flex-1 justify-center py-5 px-4 lg:px-40">
<div class="layout-content-container flex flex-col md:flex-row max-w-[1200px] flex-1 bg-[#27211b] rounded-3xl overflow-hidden shadow-2xl border border-[#393028]">

<!-- LEFT: FORM -->
<div class="flex-1 p-8 lg:p-12 flex flex-col justify-center">

<div class="flex flex-col gap-3 mb-8">
<h1 class="text-white text-4xl font-black">Đăng Ký Tài Khoản</h1>
<p class="text-[#baab9c]">Bắt đầu hành trình thưởng thức Pizza công nghệ cao cùng chúng tôi.</p>
</div>

<form class="flex flex-col gap-4">

<div class="flex flex-col gap-2">
<label class="text-sm">Họ và tên</label>
<input class="h-14 rounded-xl bg-[#181411] border border-[#54473b] px-4 text-white focus:ring-2 focus:ring-primary" placeholder="Nhập họ và tên"/>
</div>

<div class="flex flex-col gap-2">
<label class="text-sm">Số điện thoại</label>
<div class="flex gap-2">
<input class="flex-1 h-14 rounded-xl bg-[#181411] border border-[#54473b] px-4 text-white focus:ring-2 focus:ring-primary" placeholder="090xxxxxxx"/>
<button type="button" class="h-14 px-4 rounded-xl bg-primary/20 text-primary border border-primary/30 font-bold">
Gửi OTP
</button>
</div>
</div>

<div class="flex flex-col gap-2">
<label class="text-sm">Email</label>
<input class="h-14 rounded-xl bg-[#181411] border border-[#54473b] px-4 text-white focus:ring-2 focus:ring-primary" placeholder="email@vi-du.com"/>
</div>

<div class="grid md:grid-cols-2 gap-4">
<input class="h-14 rounded-xl bg-[#181411] border border-[#54473b] px-4 text-white" placeholder="Mật khẩu" type="password"/>
<input class="h-14 rounded-xl bg-[#181411] border border-[#54473b] px-4 text-white" placeholder="Xác nhận mật khẩu" type="password"/>
</div>

<div class="flex items-center gap-3">
<input type="checkbox" class="size-5 accent-primary"/>
<label class="text-sm text-[#baab9c]">Tôi đồng ý điều khoản sử dụng</label>
</div>

<a href="my-account.html"
   class="block w-full h-14 rounded-full bg-primary text-lg font-bold
          flex items-center justify-center
          hover:scale-[1.01] transition">
    Đăng Ký Ngay
</a>


</form>
</div>

<!-- RIGHT: IMAGE -->
<div class="hidden md:flex flex-1 bg-cover bg-center"
style='background-image:linear-gradient(0deg,rgba(24,20,17,.9),rgba(24,20,17,.2)),url("https://lh3.googleusercontent.com/aida-public/AB6AXuAnSsOpnjr6qr_T9WHaseA7zRoQIF_5q-4L_I4Swag2vZHiD8Uyd7WdR1wFpT1-ORjC1G6OtOtotUIZw8aXT096AZpWj0tiuGyg2aWviKcmbpcUol0o4xqz7hNZu9ywLu9DRW_OX6sPtJ1nFpIp4o7OFfRdV01cjz5uUiebhcBEsva3thBe7tW85vHSd-qD2Tyd4ctI1lGN-J7Xd3LDTx0ECDmWPBdHNc-gffvh5KyPXRV0BktU0xCPKSW5l47KQWr_tOesQ6S24Idt");'>
</div>

</div>
</main>

<footer class="py-6 text-center">

</footer>

</div>
</div>

</body>
</html>
